<section class="profile-form-section">
	<h1>Saisir le rendez-vous</h1>
	<form class="profile-form" [formGroup]="rendezvousForm">
		<div class="form-group">
			<label for="id">Id</label>
			<input type="text" id="id" name="id" formControlName="id" placeholder="1">
		</div>

        <div class="form-group">
			<label for="titre">Titre</label>
			<input type="text" id="titre" name="titre" formControlName="titre" placeholder="Médecin generaliste">
		</div>

		<div class="form-group">
			<label for="client">Client</label>
			<input type="text" id="client" name="client" formControlName="client" placeholder="Nom du client">
		</div>

		<div class="form-group">
			<label for="dateDebut">Date et heure de début</label>
			<input type="text" id="dateDebut" name="dateDebut" formControlName="dateDebut" placeholder="Date et heure de début">
		</div>

		<div class="form-group">
			<label for="dateFin">Date et heure de fin</label>
			<input type="text" id="dateFin" name="dateFin" formControlName="dateFin" placeholder="Date et heure de fin">
		</div>

		<div class="form-actions">
		
			<button type="button" class="submit-button" (click)="onAnnuler()">Annuler</button>
			<button type="submit" class="submit-button" (click)="onSubmit()" [disabled]="enCours">
				Enregistrement</button>
		</div>
	</form>
</section>
